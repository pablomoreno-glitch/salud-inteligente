# Netlify serves the React storefront (app/frontend). The API (Laravel gateway +
# FastAPI services) runs on the VPS at api.saludinteligente.lat; see deploy/README.md.
#
# Rollback to the legacy static site: publish = "public" with no base or command.

[build]
  base = "app/frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Same-origin API: the browser calls /api/* and Netlify proxies it to the gateway,
# so no CORS is involved and the API host can change without rebuilding the SPA.
[[redirects]]
  from = "/api/*"
  to = "https://api.saludinteligente.lat/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes (/producto/..., /admin, ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
