server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed build assets.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Long cache for static product and site media.
    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA also owns the literal "/api" path (the developer docs page).
    # Without these exact-match locations, nginx's try_files directory
    # fallback for a bare "/api" request 301-redirects to "/api/", which
    # then matches the proxy location below and hits the gateway instead
    # of the app - breaking a hard refresh or direct visit to the docs page.
    location = /api {
        try_files /index.html =404;
    }

    location = /api/ {
        try_files /index.html =404;
    }

    # Proxy every real API call to the Laravel gateway. 90s read timeout
    # covers the advisor chat round trip through Claude.
    location /api/ {
        proxy_pass http://gateway:8110/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # SPA fallback: any unmatched route serves index.html so React Router
    # can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
